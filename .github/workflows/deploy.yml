name: Deploy Snowflake with Schemachange

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install schemachange
        run: pip install schemachange

      - name: Create connections.toml for DEV
        run: |
          cat <<EOF > connections.toml
          [snowflake]
          account = "${{ secrets.ACCOUNT }}"
          user = "${{ secrets.USER }}"
          password = "${{ secrets.PASSWORD }}"
          role = "${{ secrets.ROLE }}"
          warehouse = "${{ secrets.WAREHOUSE }}"
          database = "BRONZE" 
          schema = "DEV" 
          EOF

      - name: Show connections.toml
        run: |
          pwd
          ls -l
          cat connections.toml


      - name: Run schemachange on DEV
        run: schemachange deploy -c schemachange-config.yml --change-history-table BRONZE.DEV.CHANGE_HISTORY --query-tag "schemachange-dev"
