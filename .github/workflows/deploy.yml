name: Deploy Migrations

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev'
    environment: dev

    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_AUTHENTICATOR: "snowflake_jwt"

    name: Deploy to DEV

    steps:
      # ============================================================
      # Basic setup
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      - name: Create private key file
        run: |
          echo "${{ secrets.PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      # ============================================================
      # Detect changed folders robustly
      # ============================================================
      - name: Detect changed folders
        id: detect
        run: |
          echo "Detecting changed folders..."

          # fallback for first run where HEAD~1 doesn't exist
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            DIFF_FILES=$(git diff --name-only HEAD)
          fi

          echo "Changed files:"
          echo "$DIFF_FILES"

          # Filter only stored_procs paths
          PROC_FILES=$(echo "$DIFF_FILES" | grep "stored_procs/migrations/scripts/" || true)

          if [ -z "$PROC_FILES" ]; then
            echo "No stored procedure changes detected."
            echo "folders=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract client folders (5th segment)
          FOLDERS=$(echo "$PROC_FILES" | awk -F'/' '{print $5}' | sort -u | paste -sd "," -)

          echo "Detected folders: $FOLDERS"
          echo "folders=$FOLDERS" >> $GITHUB_OUTPUT


      # ============================================================
      # Deploy Common — triggers ALL client configs
      # ============================================================
      - name: Deploy all clients (Common folder changed)
        if: contains(steps.detect.outputs.folders, 'Common_stored_procs')
        run: |
          CONFIG_DIR="$GITHUB_WORKSPACE/stored_procs/migrations/config"
          if [ ! -d "$CONFIG_DIR" ]; then
            echo "ERROR: Config directory missing: $CONFIG_DIR"
            exit 1
          fi

          CLIENT_CONFIGS=("client1-config.yml" "client2-config.yml" "client3-config.yml")

          for CFG in "${CLIENT_CONFIGS[@]}"; do
            FILE_PATH="$CONFIG_DIR/$CFG"

            if [ ! -f "$FILE_PATH" ]; then
              echo "ERROR: Missing configuration file: $FILE_PATH"
              exit 1
            fi

            echo ""
            echo "===================================================="
            echo "Deploying for config: $CFG"
            echo "===================================================="

            schemachange deploy \
              -f "$GITHUB_WORKSPACE/stored_procs/migrations" \
              -m "$GITHUB_WORKSPACE/stored_procs/migrations/scripts" \
              --config-folder "$CONFIG_DIR" \
              --config-file-name "$CFG" \
              --snowflake-private-key-path private_key.pem
          done


      # ============================================================
      # Deploy for each individual client (only if that folder changed)
      # ============================================================
      - name: Deploy Client1
        if: contains(steps.detect.outputs.folders, 'Client1')
        run: |
          CONFIG="$GITHUB_WORKSPACE/stored_procs/migrations/config/client1-config.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: Missing Client1 config: $CONFIG"
            exit 1
          fi

          echo "Deploying Client1..."
          schemachange deploy \
            -f "$GITHUB_WORKSPACE/stored_procs/migrations" \
            -m "$GITHUB_WORKSPACE/stored_procs/migrations/scripts" \
            --config-folder "$GITHUB_WORKSPACE/stored_procs/migrations/config" \
            --config-file-name client1-config.yml \
            --snowflake-private-key-path private_key.pem

      - name: Deploy Client2
        if: contains(steps.detect.outputs.folders, 'Client2')
        run: |
          CONFIG="$GITHUB_WORKSPACE/stored_procs/migrations/config/client2-config.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: Missing Client2 config: $CONFIG"
            exit 1
          fi

          echo "Deploying Client2..."
          schemachange deploy \
            -f "$GITHUB_WORKSPACE/stored_procs/migrations" \
            -m "$GITHUB_WORKSPACE/stored_procs/migrations/scripts" \
            --config-folder "$GITHUB_WORKSPACE/stored_procs/migrations/config" \
            --config-file-name client2-config.yml \
            --snowflake-private-key-path private_key.pem

      - name: Deploy Client3
        if: contains(steps.detect.outputs.folders, 'Client3')
        run: |
          CONFIG="$GITHUB_WORKSPACE/stored_procs/migrations/config/client3-config.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: Missing Client3 config: $CONFIG"
            exit 1
          fi

          echo "Deploying Client3..."
          schemachange deploy \
            -f "$GITHUB_WORKSPACE/stored_procs/migrations" \
            -m "$GITHUB_WORKSPACE/stored_procs/migrations/scripts" \
            --config-folder "$GITHUB_WORKSPACE/stored_procs/migrations/config" \
            --config-file-name client3-config.yml \
            --snowflake-private-key-path private_key.pem
