name: Deploy Migrations

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev'
    environment: dev

    env:
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_AUTHENTICATOR: "snowflake_jwt"

    name: Deploy to DEV

    steps:

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      - name: Create private key file
        run: |
          echo "${{ secrets.PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem


      - name: Detect changed folders
        id: detect
        run: |
          echo "Detecting changed folders..."

          # Github provides hashes for the last and new commit
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          echo "Before SHA: $BEFORE_SHA"
          echo "After SHA:  $AFTER_SHA"

          # Handle case where before sha is all zeros (new branch)
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "First push detected. Using all files."
            DIFF_FILES=$(git ls-files)
          else
            DIFF_FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          fi

          echo "Changed files:"
          echo "$DIFF_FILES"

          # Filter only migrations path
          PROC_FILES=$(echo "$DIFF_FILES" | grep -E '^stored_procs/migrations/scripts/' || true)

          if [ -z "$PROC_FILES" ]; then
            echo "No stored procedure changes detected."
            echo "folders=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract folder name (5th element)
          FOLDERS=$(echo "$PROC_FILES" | awk -F'/' '{print $4}' | sort -u | paste -sd "," -)

          echo "Detected folders: $FOLDERS"
          echo "folders=$FOLDERS" >> $GITHUB_OUTPUT



      - name: Deploy Common
        if: contains(steps.detect.outputs.folders, 'Common_stored_procs')
        run: |
          for CFG in client1-config.yml client2-config.yml client3-config.yml; do
            echo "Deploying for config: $CFG"
            schemachange deploy \
              -f "$GITHUB_WORKSPACE/stored_procs/migrations/scripts/Common_stored_procs" \
              -m "$GITHUB_WORKSPACE/stored_procs/migrations/scripts/Common_stored_procs" \
              --config-folder "$GITHUB_WORKSPACE/stored_procs/migrations/config" \
              --config-file-name $CFG \
              --snowflake-private-key-path private_key.pem
          done


      - name: Deploy Client1
        if: contains(steps.detect.outputs.folders, 'Client1')
        run: |
          CONFIG="$GITHUB_WORKSPACE/stored_procs/migrations/config/client1-config.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: Missing Client1 config: $CONFIG"
            exit 1
          fi

          echo "Deploying Client1..."
          schemachange deploy \
            -f "$GITHUB_WORKSPACE/stored_procs/migrations/scripts/Client1" \
            -m "$GITHUB_WORKSPACE/stored_procs/migrations/scripts/Client1" \
            --config-folder "$GITHUB_WORKSPACE/stored_procs/migrations/config" \
            --config-file-name client1-config.yml \
            --snowflake-private-key-path private_key.pem

      - name: Deploy Client2
        if: contains(steps.detect.outputs.folders, 'Client2')
        run: |
          CONFIG="$GITHUB_WORKSPACE/stored_procs/migrations/config/client2-config.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: Missing Client2 config: $CONFIG"
            exit 1
          fi

          echo "Deploying Client2..."
          schemachange deploy \
            -f "$GITHUB_WORKSPACE/stored_procs/migrations/scripts/Client2" \
            -m "$GITHUB_WORKSPACE/stored_procs/migrations/scripts/Client2" \
            --config-folder "$GITHUB_WORKSPACE/stored_procs/migrations/config" \
            --config-file-name client2-config.yml \
            --snowflake-private-key-path private_key.pem

      - name: Deploy Client3
        if: contains(steps.detect.outputs.folders, 'Client3')
        run: |
          CONFIG="$GITHUB_WORKSPACE/stored_procs/migrations/config/client3-config.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: Missing Client3 config: $CONFIG"
            exit 1
          fi

          echo "Deploying Client3..."
          schemachange deploy \
            -f "$GITHUB_WORKSPACE/stored_procs/migrations/scripts/Client3" \
            -m "$GITHUB_WORKSPACE/stored_procs/migrations/scripts/Client3" \
            --config-folder "$GITHUB_WORKSPACE/stored_procs/migrations/config" \
            --config-file-name client3-config.yml \
            --snowflake-private-key-path private_key.pem
